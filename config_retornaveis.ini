additional_context = BRIEFING DE ANÁLISE - FOCO PRIORITÁRIO (C-LEVEL):
  O usuário está enfrentando um desafio de "Fadiga Promocional" geral nas campanhas de marketing da marca. O objetivo principal desta análise de sentimento e feedback é extrair insights estratégicos do YouTube para subsidiar uma nova estratégia para a campanha de "Garrafas Retornáveis" no Q3 (território de Meals - almoço/refeições em família).
  
  DORES ESPECÍFICAS E OBJETIVOS DA ANÁLISE:
  1. COMPORTAMENTO DE TROCA E HÁBITO: Mapear as dores reais dos consumidores ao levar garrafas retornáveis de refrigerantes de volta ao ponto de venda. Quais as principais barreiras de fricção física mencionadas? (Ex: esquecimento de levar o vasilhame vazio, peso/esforço físico de transportar, dificuldade em encontrar pontos de troca parceiros próximos, vergonha de carregar as garrafas vazias pela rua, falta de espaço para armazenar garrafas em casa).
  2. RECOMPENSAS E ATRAÇÃO: Como o consumidor se relaciona com mecânicas promocionais de retornáveis? O que os feedbacks mostram sobre o interesse em gamificação, cashback, descontos imediatos na troca, ou brindes instantâneos?
  3. EFICÁCIA DAS MECÂNICAS HISTÓRICAS: O que os consumidores dizem sobre promoções passadas de retornáveis (como cadastrar códigos de tampinhas por WhatsApp ou app)? Eles acham burocrático ou engajam?
  4. "HACKS" DE COMPORTAMENTO & TECNOLOGIA: Como podemos usar mídias, parcerias ou tecnologia/SVAs para simplificar a vida do consumidor e transformar a troca em um hábito contínuo de economia circular?
  
  ORIENTAÇÕES PARA O RELATÓRIO E OS SLIDES:
  - O relatório e a apresentação de slides de 8 páginas devem responder diretamente a essas perguntas com tom estratégico C-Level.
  - Apresente ideias e recomendações acionáveis de como contornar (ou "hackear") a fricção do esquecimento e do esforço físico da troca.
output_language = Portuguese

